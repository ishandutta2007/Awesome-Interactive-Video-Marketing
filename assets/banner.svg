<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" style="background:#090d16; border-radius: 16px; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#070a13" />
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.0" />
    </linearGradient>

    <linearGradient id="btnGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <!-- Filters for Glow Effects -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    /* CSS Keyframe Animations */
    @keyframes pulseRing {
      0% { r: 14; opacity: 0.9; }
      50% { r: 24; opacity: 0.2; }
      100% { r: 14; opacity: 0.9; }
    }
    @keyframes hotspotMove {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes floatCard1 {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(-6px, -10px); }
    }
    @keyframes floatCard2 {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(8px, 10px); }
    }
    @keyframes streamFlow {
      0% { stroke-dashoffset: 120; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes cursorClick {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(0.85); }
    }

    .pulse-glow { animation: pulseRing 2.8s infinite ease-in-out; }
    .floating-card-1 { animation: floatCard1 5s infinite ease-in-out; }
    .floating-card-2 { animation: floatCard2 6s infinite ease-in-out; }
    .interactive-hotspot { animation: hotspotMove 3.5s infinite ease-in-out; }
    .flow-line { stroke-dasharray: 8 6; animation: streamFlow 4s linear infinite; }
    .cursor-anim { animation: cursorClick 2s infinite ease-in-out; transform-origin: 215px 190px; }
  </style>

  <!-- Canvas Background -->
  <rect width="1200" height="360" fill="url(#bgGrad)" />

  <!-- Subtle Tech Grid Lines in Background -->
  <g opacity="0.12" stroke="#38bdf8" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="200" y1="0" x2="200" y2="360" />
    <line x1="400" y1="0" x2="400" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="800" y1="0" x2="800" y2="360" />
    <line x1="1000" y1="0" x2="1000" y2="360" />
  </g>

  <!-- Ambient Glowing Orbs (Strictly Background Depth) -->
  <circle cx="980" cy="110" r="140" fill="#6366f1" opacity="0.12" filter="url(#glow)" />
  <circle cx="150" cy="240" r="110" fill="#06b6d4" opacity="0.10" filter="url(#glow)" />

  <!-- DYNAMIC ANIMATED ELEMENTS (Arranged on flanks to NEVER obstruct foreground text) -->

  <!-- Left Flank: Interactive Branching Node Diagram -->
  <g transform="translate(60, 45)" opacity="0.85">
    <!-- Connecting Stream Lines -->
    <path d="M 50 135 C 100 135, 110 80, 160 80" fill="none" stroke="#6366f1" stroke-width="2.5" class="flow-line" />
    <path d="M 50 135 C 100 135, 110 190, 160 190" fill="none" stroke="#ec4899" stroke-width="2.5" class="flow-line" />

    <!-- Root Video Node -->
    <circle cx="50" cy="135" r="20" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
    <polygon points="45,126 45,144 60,135" fill="#38bdf8" />

    <!-- Branch A: Conversion Gate -->
    <g class="interactive-hotspot">
      <circle cx="160" cy="80" r="16" fill="#1e1b4b" stroke="#818cf8" stroke-width="2" />
      <circle cx="160" cy="80" r="22" fill="none" stroke="#818cf8" class="pulse-glow" />
      <text x="160" y="84" fill="#c7d2fe" font-size="11" font-weight="bold" text-anchor="middle">CTA</text>
    </g>

    <!-- Branch B: Shoppable Hotspot -->
    <g class="interactive-hotspot">
      <circle cx="160" cy="190" r="16" fill="#4c0519" stroke="#f43f5e" stroke-width="2" />
      <circle cx="160" cy="190" r="22" fill="none" stroke="#f43f5e" class="pulse-glow" />
      <text x="160" y="194" fill="#fecdd3" font-size="11" font-weight="bold" text-anchor="middle">SHOP</text>
    </g>

    <!-- Pointer Cursor Trigger -->
    <g class="cursor-anim" transform="translate(5, -5)">
      <path d="M 175 195 L 188 208 L 183 210 L 188 219 L 184 221 L 179 212 L 174 216 Z" fill="#38bdf8" stroke="#ffffff" stroke-width="1.5" />
    </g>
  </g>

  <!-- Right Flank: Dynamic Video Player HUD with Floating Pill Overlays -->
  <g transform="translate(860, 45)" opacity="0.95">
    <!-- Video Player Container Frame -->
    <rect x="0" y="20" width="280" height="175" rx="14" fill="#0f172a" stroke="#334155" stroke-width="2" />
    
    <!-- Player Screen Background -->
    <rect x="8" y="28" width="264" height="135" rx="8" fill="#1e293b" />
    
    <!-- Video Scene Mock Waveform -->
    <path d="M 18 115 Q 70 85 130 115 T 250 100" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.4" />

    <!-- Play/Pause Button Mock -->
    <circle cx="140" cy="92" r="18" fill="#090d16" stroke="#38bdf8" stroke-width="1.5" opacity="0.8" />
    <polygon points="136,84 136,100 148,92" fill="#38bdf8" />

    <!-- Progress Timeline Bar with Interactive Markers -->
    <rect x="18" y="148" width="244" height="4" rx="2" fill="#334155" />
    <rect x="18" y="148" width="135" height="4" rx="2" fill="url(#titleGrad)" />
    <!-- Timestamp markers -->
    <circle cx="75" cy="150" r="3.5" fill="#38bdf8" />
    <circle cx="120" cy="150" r="3.5" fill="#ec4899" />
    <circle cx="153" cy="150" r="5" fill="#ffffff" />

    <!-- Animated Floating Card 1: Shoppable Tag Overlay -->
    <g class="floating-card-1" transform="translate(130, 40)">
      <rect x="0" y="0" width="135" height="42" rx="8" fill="#18181b" stroke="#ec4899" stroke-width="1.5" filter="url(#glow)" opacity="0.95" />
      <text x="12" y="17" fill="#f472b6" font-size="10" font-weight="bold">🛍️ In-Video Buy</text>
      <text x="12" y="32" fill="#e2e8f0" font-size="11" font-weight="600">$49.00 • 1-Click</text>
    </g>

    <!-- Animated Floating Card 2: Interactive Quiz Poll -->
    <g class="floating-card-2" transform="translate(-15, 115)">
      <rect x="0" y="0" width="145" height="42" rx="8" fill="#18181b" stroke="#38bdf8" stroke-width="1.5" filter="url(#glow)" opacity="0.95" />
      <text x="12" y="17" fill="#38bdf8" font-size="10" font-weight="bold">📊 Question Gate</text>
      <text x="12" y="32" fill="#f8fafc" font-size="11" font-weight="600">Choose Your Path →</text>
    </g>
  </g>

  <!-- FOREGROUND: TITLE & VALUE PROPOSITION (Guaranteed unobstructed & centered in safe middle zone) -->
  <g transform="translate(600, 115)" text-anchor="middle">
    <!-- Top Category Pill Badge -->
    <rect x="-140" y="-55" width="280" height="28" rx="14" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.2" />
    <text x="0" y="-36" fill="#a5b4fc" font-size="12" font-weight="700" letter-spacing="1.5">🎬 INTERACTIVE VIDEO MARKETING</text>

    <!-- Main Title (Stands out crisp and clear) -->
    <text x="0" y="24" fill="url(#titleGrad)" font-size="40" font-weight="900" letter-spacing="-0.8">Awesome Interactive Video</text>

    <!-- Subtitle -->
    <text x="0" y="65" fill="#f8fafc" font-size="18" font-weight="600" opacity="0.95">
      Players • Shoppable Video • Branching Narratives • Conversion Gates
    </text>

    <!-- Supporting Tagline -->
    <text x="0" y="98" fill="#94a3b8" font-size="13" font-weight="400">
      Curated ecosystem of enterprise SaaS platforms and high-performance open-source engines
    </text>

    <!-- Feature Quick Pills -->
    <g transform="translate(0, 132)">
      <!-- Pill 1 -->
      <rect x="-240" y="0" width="110" height="24" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-width="1" />
      <text x="-185" y="16" fill="#38bdf8" font-size="11" font-weight="600">⚡ Fast Runtimes</text>

      <!-- Pill 2 -->
      <rect x="-115" y="0" width="115" height="24" rx="12" fill="#0f172a" stroke="#818cf8" stroke-width="1" />
      <text x="-57" y="16" fill="#818cf8" font-size="11" font-weight="600">🔀 Branching Trees</text>

      <!-- Pill 3 -->
      <rect x="15" y="0" width="110" height="24" rx="12" fill="#0f172a" stroke="#ec4899" stroke-width="1" />
      <text x="70" y="16" fill="#ec4899" font-size="11" font-weight="600">🛒 Shoppable</text>

      <!-- Pill 4 -->
      <rect x="140" y="0" width="105" height="24" rx="12" fill="#0f172a" stroke="#10b981" stroke-width="1" />
      <text x="192" y="16" fill="#10b981" font-size="11" font-weight="600">🎯 CRM Ingest</text>
    </g>
  </g>
</svg>
